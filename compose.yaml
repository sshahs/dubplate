# Dubplate — docker compose up -d, then open http://localhost:4455
#
# Uses the published image from GitHub Container Registry. To build from
# source instead: docker compose -f compose.yaml -f compose.build.yaml up -d --build
#
# Mount the folders you want tagged under /music and add them in the app as
# libraries (e.g. /music/reggae). Dubplate only writes to them once you switch
# off read-only mode, so the container user needs write access for renames —
# set PUID/PGID to the owner of your music.

services:
  dubplate:
    image: ghcr.io/sshahs/dubplate:${DUBPLATE_TAG:-latest}
    container_name: dubplate
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${DUBPLATE_PORT:-4455}:4455"
    environment:
      # Hostnames you'll browse to besides localhost (e.g. your NAS name or IP).
      DUBPLATE_ALLOWED_HOSTS: ${DUBPLATE_ALLOWED_HOSTS:-}
      # Ollama running on the Docker host; use http://ollama:11434 with the
      # bundled service below (docker compose --profile ollama up -d).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      # Cloud keys are optional — they can also be entered in Settings.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      COMMANDCODE_API_KEY: ${COMMANDCODE_API_KEY:-}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}
    volumes:
      - dubplate-data:/data
      - ${MUSIC_DIR:-./music}:/music
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional local LLM: docker compose --profile ollama up -d
  # then: docker compose exec ollama ollama pull qwen3:8b
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama

volumes:
  dubplate-data:
  ollama-models:
