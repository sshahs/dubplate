name: Docker image

# Builds the image on every PR and publishes it to GitHub Container Registry
# (ghcr.io/<owner>/dubplate) from main and from version tags:
#   main      → :latest, :sha-<short>
#   v1.2.3    → :1.2.3, :1.2, :1

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          # GHCR shows a multi-arch image's description from the image index, not the
          # per-platform manifests, so annotate both. The description itself comes from
          # the GitHub repository's About text.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,format=short
            type=ref,event=pr

      # Build for the runner's platform first and make sure the server boots.
      - name: Build (smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dubplate:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 4455:4455 dubplate:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4455/api/health; then
              echo
              curl -fsS -o /dev/null http://localhost:4455/ && echo "UI served"
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signed build provenance. GitHub only offers this for public repos
      # (or Enterprise Cloud), so it's skipped while the repo is private.
      - name: Attest build provenance
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records only exist for organisation-owned repositories.
          create-storage-record: ${{ github.event.repository.owner.type == 'Organization' }}

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### 🔊 Published ghcr.io/${{ github.repository }}"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${{ github.repository }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
