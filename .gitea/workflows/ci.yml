name: CI

# Gitea Actions (act_runner) copy of .github/workflows/ci.yml. With a .gitea/workflows
# folder present, Gitea runs these and ignores .github/workflows.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v4 runs on node20, which every act_runner release supports.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
