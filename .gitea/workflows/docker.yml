name: Docker image

# Builds the image on every PR and publishes it to this Gitea instance's container
# registry (<gitea host>/<owner>/dubplate) from main and from version tags:
#   main      → :latest, :sha-<short>
#   v1.2.3    → :1.2.3, :1.2, :1
#
# Needs a runner with Docker (act_runner with the host's docker socket).
# Publishing needs a repository (or organisation) secret REGISTRY_TOKEN: a Gitea
# access token with package write access. Without it the image is still built and
# smoke-tested, just not pushed (REGISTRY_USER: the token's owner, if not the
# pusher). Set the variable DOCKER_PLATFORMS to e.g.
# "linux/amd64" to skip the slower emulated arm64 build.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Registry and image name
        id: reg
        run: |
          host="${GITHUB_SERVER_URL#*://}"
          host="${host%/}"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "image=$host/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.reg.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ gitea.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(gitea.ref, 'refs/tags/v0.') }}
            type=sha,format=short
            type=ref,event=pr

      # Build for the runner's platform first and make sure the server boots.
      - name: Build (smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dubplate:smoke

      # Checked from inside the container: on act_runner the job itself runs in a
      # container, so a port published on the Docker host isn't on its localhost.
      - name: Smoke test
        run: |
          docker rm -f smoke >/dev/null 2>&1 || true
          docker run -d --name smoke dubplate:smoke
          for i in $(seq 1 30); do
            if docker exec smoke node -e "Promise.all([fetch('http://127.0.0.1:4455/api/health'), fetch('http://127.0.0.1:4455/')]).then(([h, ui]) => process.exit(h.ok && ui.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              echo "Server up and UI served"
              docker rm -f smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          docker rm -f smoke >/dev/null
          exit 1

      - name: Can publish?
        id: can
        if: gitea.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "push=true" >> "$GITHUB_OUTPUT"; else echo "No REGISTRY_TOKEN secret - built and tested, not pushed"; fi

      - name: Log in to the Gitea container registry
        if: steps.can.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.host }}
          # The token owner; set the variable REGISTRY_USER if that isn't whoever pushed.
          username: ${{ vars.REGISTRY_USER || gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push
        if: steps.can.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ vars.DOCKER_PLATFORMS || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Gitea doesn't tie a pushed image to its repository by itself: link it (Gitea
      # 1.24+), so it shows under the repo's Packages. Already linked is fine; an older
      # Gitea says so, and the link can be made by hand in the package's settings.
      - name: Link the package to this repository
        if: steps.can.outputs.push == 'true'
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          name="$(echo "$repo" | tr '[:upper:]' '[:lower:]')"
          url="${GITHUB_SERVER_URL%/}/api/v1/packages/$owner/container/$name/-/link/$repo"
          code=$(curl -sS -o /tmp/link.out -w '%{http_code}' -X POST -H "Authorization: token $TOKEN" "$url" || echo 000)
          case "$code" in
            2*) echo "Linked container package $owner/$name to $GITHUB_REPOSITORY" ;;
            409|422) echo "Already linked: $(cat /tmp/link.out)" ;;
            404) echo "::warning::This Gitea can't link packages over its API (1.24+ can) - link $owner/$name to $repo in the package's settings"; cat /tmp/link.out ;;
            *) echo "::warning::Couldn't link the package ($code): $(cat /tmp/link.out)" ;;
          esac
